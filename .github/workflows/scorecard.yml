name: scorecard

# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned actions, token
# permissions, branch protection...) and publishes the result for the public badge and API.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  # Re-scores when a branch protection rule changes.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # uploads the SARIF to code scanning
      id-token: write # signs the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
