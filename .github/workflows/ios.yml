name: ios

# The iPhone app and its core build on macOS only. The paths filter keeps a change that touches
# none of them from starting a macOS machine; a skipped run blocks no merge, as main's ruleset
# requires `check`, `e2e` and `image` only, not this job. The UI tests stay off CI: the suite
# takes about 85 minutes.
on:
  push:
    branches: [main]
    paths:
      - apps/apple/**
      - packages/shared/**
      - scripts/swift-vectors.ts
      - .github/workflows/ios.yml
  pull_request:
    branches: [main]
    paths:
      - apps/apple/**
      - packages/shared/**
      - scripts/swift-vectors.ts
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The app uses iOS 27 APIs behind availability checks, which need the iOS 27 SDK to compile.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swift test --package-path apps/apple/BelayCore
      # A simulator build needs no signing, so the job reads no secret.
      - run: >-
          xcodebuild -project apps/apple/Belay.xcodeproj -scheme Belay -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build -quiet
