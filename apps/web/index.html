<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#F3F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10151A" media="(prefers-color-scheme: dark)" />
    <!-- The display face, fetched with the page rather than once the stylesheet asks for it, so
         the first titles and figures are drawn in it. -->
    <link
      rel="preload"
      href="/src/fonts/archivo-belay.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="/theme-init.js"></script>
    <style>
      .launch {
        position: fixed;
        inset: 0;
        /* Above the app's own layers (z-50 at most), which render under it while it shows. */
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f3f5f5;
        color: #12181c;
      }
      .launch > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transform: translateY(-6vh);
      }
      .launch .mark {
        width: 112px;
        color: #1f4e8c;
      }
      /* The word is drawn, not set: no font is loaded at the first paint, and the launch images
         must show the same shapes. 80.29 px wide is the outline's advance at 23 px. */
      .launch .word {
        width: 80.29px;
      }
      /* The mark breathes from its first frame, the second hook half a beat behind. Each breath
         starts at full strength, as the launch images paint the mark. */
      .launch [data-hook] {
        animation: var(--animate-breathe);
      }
      .launch [data-hook="b"] {
        animation-delay: calc(var(--dur-breathe) / 2);
      }
      /* Once the account is known: a short fade, then out of reach; 120 ms under reduced motion. */
      .launched .launch {
        opacity: 0;
        visibility: hidden;
        /* Taps reach the app at once, while the splash is still fading. */
        pointer-events: none;
        transition:
          opacity var(--dur-launch-out) var(--ease-out),
          visibility 0s var(--dur-launch-out);
      }
      /* Hidden, the screen stays in the page: its breathing stops where it is rather than run
         behind the app for good. */
      .launched .launch [data-hook] {
        animation-play-state: paused;
      }
      html.dark .launch {
        background: #10151a;
        color: #eef2f3;
      }
      html.dark .launch .mark {
        color: #8db6ee;
      }
      /* In the apps the launch screen is the system's own splash carried on: the mark alone,
         centred, with no word and no lift, so nothing moves at the handover. */
      html[data-platform] .launch > div {
        transform: none;
      }
      html[data-platform] .launch .word {
        display: none;
      }
      /* The system splash draws the mark at this width: 288 dp of the icon canvas, of which the
         mark's ink is 164 of 432 px. */
      html[data-platform="android"] .launch .mark {
        width: 109.33px;
      }
      /* Charter §8: no launch screen on a computer, the tab favicon is enough. */
      @media (min-width: 1024px) {
        .launch {
          display: none;
        }
      }
    </style>
    <title>Belay</title>
  </head>

    <div class="launch">
