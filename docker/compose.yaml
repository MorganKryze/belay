# A fixed project name: a stray `docker compose down -v` from another folder or
# project must never resolve to this stack and delete the database volume.
name: belay

services:
  db:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: belay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env next to compose.yaml}
      POSTGRES_DB: belay
    volumes:
      # Put this volume on an encrypted disk: it holds health data (see README, threat model).
      - db:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: the init-time temporary server listens on the socket only,
      # so the check cannot pass before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U belay -d belay"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${BELAY_IMAGE:-ghcr.io/morgankryze/belay:latest}
    depends_on:
      db:
        condition: service_healthy
    # The same .env feeds the ${...} substitutions in this file and the app's environment.
    env_file: ${BELAY_ENV_FILE:-.env}
    environment:
      # The owner runs the migrations at startup; the app then serves as belay_app,
      # a role that owns no table (see README, threat model).
      # ponytail: the passwords are spliced in unencoded, so they must be URL-safe
      # (openssl rand -hex 24). Upgrade path: percent-encode them.
      DATABASE_URL: postgres://belay:${POSTGRES_PASSWORD}@db:5432/belay
      APP_DATABASE_URL: postgres://belay_app:${BELAY_APP_PASSWORD:?set BELAY_APP_PASSWORD in the .env next to compose.yaml}@db:5432/belay
    ports:
      # Loopback only: a reverse proxy fronts Belay and terminates TLS. Docker publishes
      # ports through its own iptables rules and bypasses host firewalls (ufw, firewalld),
      # so a bare "3000:3000" would expose the app to the network.
      - "127.0.0.1:${BELAY_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db:
