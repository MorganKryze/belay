name: ci

on:
  push:
    # Temporary: ci-hardening takes deliberately faulty PRs to prove its new controls.
    branches: [main, ci-hardening]
  pull_request:
    branches: [main, ci-hardening]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Fails on any known advisory (OSV: GitHub, npm, NVD) against a version in the lockfile.
      # The binary is pinned by checksum, since the official action runs a mutable image tag;
      # the advisory database is fetched live, so an older binary still sees new advisories.
      - name: osv-scanner
        env:
          OSV_VERSION: v2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-scanner"
          curl -fsSL -o "$bin" "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          "$bin" scan source --lockfile=pnpm-lock.yaml
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # docs/science.md is generated from packages/shared/src/science; fail when it was not regenerated.
      - run: pnpm science:check
      # The exercise library is generated by `pnpm exercises:import`; check the committed files.
      - run: pnpm exercises:check
      # The native core is tested against cases the shared rules compute; fail when a rule
      # changed and they were not regenerated.
      - run: pnpm vectors:check
      - run: pnpm typecheck
      # Server tests start PostgreSQL through Testcontainers on the runner's Docker.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @belay/web exec playwright install --with-deps chromium
      # The page names Roboto ahead of the generic system face: with it installed, the runner
      # measures text in the face Android phones draw, not in the runner's own default.
      - run: sudo apt-get install -y --no-install-recommends fonts-roboto
      - run: pnpm e2e --shard=${{ matrix.shard }}/2

  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The default builder keeps the image in the local daemon, where Trivy reads it.
      - run: docker build -f docker/Dockerfile -t belay:ci .
      # Fails on a CRITICAL vulnerability that has a fixed version: bumping the base image
      # (or the dependency) clears it. Unfixed ones would block with nothing to do.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: belay:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: scripts/smoke.sh belay:ci
